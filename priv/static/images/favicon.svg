<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- NOTE(Claude 2026-11-06): the FinnGen Data Catalog favicon, pixelated:
       an 8 by 8 grid of 4 px pixels (2 px at 16 px), nothing thinner. A 3 by 3
       grid of cells, each 2 by 2 pixels, touching, inside a one-pixel orange
       border; white cells and faint ones, like a table of datasets and the
       data each one has:
         W . .
         W W .
         W . W
       White on the brand orange, never black; square corners. -->
  <rect width="32" height="32" fill="#fd4f00"/>
  <g fill="#ffffff" fill-opacity="0.3">
    <rect x="12" y="4" width="8" height="8"/>
    <rect x="20" y="4" width="8" height="8"/>
    <rect x="20" y="12" width="8" height="8"/>
    <rect x="12" y="20" width="8" height="8"/>
  </g>
  <g fill="#ffffff">
    <rect x="4" y="4" width="8" height="8"/>
    <rect x="4" y="12" width="8" height="8"/>
    <rect x="12" y="12" width="8" height="8"/>
    <rect x="4" y="20" width="8" height="8"/>
    <rect x="20" y="20" width="8" height="8"/>
  </g>
</svg>
